name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: bash ./gradlew assembleLeanback${{ inputs.build_type == 'release' && 'Release' || 'Debug' }} assembleMobile${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-tmdb-${{ inputs.build_type }}
          path: app/build/outputs/apk/**/*.apk
